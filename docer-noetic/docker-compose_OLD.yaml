version: "3.3"

services:
  limo-noetic-container:
    # 로컬 Dockerfile로 이미지 빌드 (GPU/CUDA10.2 + Noetic 기준)
    build:
      context: .
      dockerfile: Dockerfile.noetic
    image: limo-noetic:cuda10.2
    container_name: limo-noetic-nano

    privileged: true
    network_mode: host
    ipc: host
    restart: unless-stopped

    # 레거시 docker-compose에선 runtime: nvidia 키가 안 먹는 경우가 많음.
    # Nano(JetPack 4.x)는 기본 런타임이 nvidia면 자동으로 GPU 사용됨.

    environment:
      # --- ROS 네트워킹 ---
      - ROS_MASTER_URI=http://localhost:11311

      # --- NVIDIA/CUDA(나중에 GUI 필요시만 DISPLAY 사용) ---
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
      - PATH=/usr/local/cuda-10.2/bin:${PATH}
      - LD_LIBRARY_PATH=/usr/local/cuda-10.2/lib64:${LD_LIBRARY_PATH}

      # headless면 X11 비활성
      # - DISPLAY=${DISPLAY}
      # - QT_X11_NO_MITSHM=1

    volumes:
      # 디바이스 패스스루
      - /dev:/dev

      # 호스트 워크스페이스 <-> 컨테이너
      - /home/agilex/limo_kante_ws:/root/ws:rw

      # 타임존 동기화
      - /etc/localtime:/etc/localtime:ro
      # GUI 필요시 주석 해제
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # - /home/agilex/.Xauthority:/root/.Xauthority:ro

    # 컨테이너 시작 시 워크스페이스 의존성/SDK 세팅 + 셸 유지
    command: ["/usr/local/bin/init_ws.sh"]
